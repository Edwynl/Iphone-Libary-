name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r engine/requirements-test.lock.txt
      - run: python -m pytest -q tests/

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/WindowsAIPhotos/WindowsAIPhotos.csproj -p:Platform=x64
      - name: Build WinUI
        run: dotnet build src/WindowsAIPhotos/WindowsAIPhotos.csproj -p:Platform=x64 -c Release --no-restore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r engine/requirements-test.lock.txt
      - name: Shipped worker and static resources smoke test
        run: python scripts/smoke-output.py src/WindowsAIPhotos/bin/x64/Release/net10.0-windows10.0.19041.0/engine

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Unsigned simulator compile
        run: bash scripts/build-ios.sh
