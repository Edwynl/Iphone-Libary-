name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r engine/requirements-test.txt
      - run: python -m pytest -q tests/

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/WindowsAIPhotos/WindowsAIPhotos.csproj -p:Platform=x64
      - name: Build WinUI
        run: dotnet build src/WindowsAIPhotos/WindowsAIPhotos.csproj -p:Platform=x64 -c Release --no-restore
