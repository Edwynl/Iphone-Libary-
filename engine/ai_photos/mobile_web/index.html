<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Windows AI Photos - iPhone companion</title><link rel="stylesheet" href="/app.css"></head>
<body><main><header><span class="eyebrow">PRIVATE LIBRARY</span><h1>Windows AI Photos</h1><p>Upload from your iPhone. Browse your Windows photo collection.</p></header>
<section id="pair" class="panel"><label for="token">Pairing token from Windows</label><input id="token" type="password" autocomplete="off" placeholder="Paste pairing token"><button id="connect">Connect securely</button><p id="connection" role="status"></p></section>
<section id="library" hidden><div class="panel"><h2>Upload photos and videos</h2><input type="file" id="files" multiple accept="image/*,video/*,.heic,.heif"><button id="upload">Upload selected files</button><p id="progress" role="status">Files are copied; originals stay on your iPhone.</p></div>
<div class="library-head"><h2>Library</h2><button id="refresh">Refresh</button></div><div id="grid" class="grid"></div>
<p id="more" class="more" role="status"></p></section>
<footer>Accessible only when your Windows PC is running. Keep Tailscale connected outside home.</footer></main>
<div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title">
<div class="viewer-bar"><button id="viewer-close" class="round" aria-label="Close">&#x2715;</button><div class="viewer-text"><strong id="viewer-title"></strong><span id="viewer-count"></span></div></div>
<div id="stage" class="stage"><img id="viewer-image" alt=""><video id="viewer-video" playsinline controls hidden></video><p id="viewer-note" class="viewer-note" hidden></p></div>
<div class="viewer-bar viewer-actions"><button id="viewer-prev" class="round" aria-label="Previous">&#x2039;</button><button id="viewer-live" hidden>Play Live</button><button id="viewer-save">Save to iPhone</button><button id="viewer-next" class="round" aria-label="Next">&#x203A;</button></div>
</div>
<script src="/app.js" defer></script></body></html>
