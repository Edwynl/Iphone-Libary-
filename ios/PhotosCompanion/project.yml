name: PhotosCompanion
options:
  bundleIdPrefix: com.edwyn.windowsaiphotos
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  PhotosCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edwyn.windowsaiphotos.companion
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Photos Companion
        CFBundleName: PhotosCompanion
        CFBundleShortVersionString: '0.2.0'
        CFBundleVersion: '1'
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: 'Allow reading selected photos, HEIC originals, Live Photos and videos to back them up to your paired Windows computer.'
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.edwyn.windowsaiphotos.companion.sync
schemes:
  PhotosCompanion:
    build:
      targets:
        PhotosCompanion: all
    run:
      config: Debug
